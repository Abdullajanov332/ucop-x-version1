# UCOP-X Enterprise - Cargo Configuration
[alias]
ucx = "run --package ucx-cli --"
test-all = "test --workspace -- --nocapture"
build-release = "build --release --workspace"
check-all = "check --workspace"
bench-all = "bench --workspace"

[build]
incremental = true
target-dir = "target"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
linker = "lld"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=x86-64-v3",
]

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))']
rustflags = ["-C", "target-cpu=apple-m1"]

[env]
UCOP_X_HOME = { value = ".ucop-x", relative = true }
UCOP_X_LOG_LEVEL = { value = "info" }
