[workspace]
resolver = "3"
members = [
    "kernel", "memory", "scheduler", "crypto",
    "net", "re-engine", "static-analysis", "dynamic-analysis",
    "malware-analysis", "forensics", "ir", "threat-intel",
    "reporting", "asset-inventory", "compliance",
    "plugin-sdk", "cli", "docs-generator", "test-framework",
    "lua-runtime", "js-api", "telemetry", "rule-engine",
    "os-integration/linux", "os-integration/windows", "os-integration/macos",
    "lang-analysis/dotnet", "lang-analysis/java", "lang-analysis/php",
    "lang-analysis/solidity", "lang-analysis/vba",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UCOP-X-EULA"
authors = ["UCOP-X Enterprise Team"]
description = "UCOP-X Enterprise - Offline-first cybersecurity platform"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"
rayon = "1"
num_cpus = "1"
fxhash = "0.2"
once_cell = "1"
bitflags = "2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
blake3 = "1"
aes-gcm = "0.10"
ed25519-dalek = "2"
x25519-dalek = "2"
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
indicatif = "0.17"
colored = "2"
dialoguer = "0.11"
comfy-table = "7"
toml = "0.8"
dirs = "5"
glob = "0.3"
walkdir = "2"
tempfile = "3"
rstest = "0.23"
proptest = "1"
regex = "1"
